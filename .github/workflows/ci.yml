# Continuous integration (SRS OPS 002). Installs from the frozen lockfile,
# checks the code, then runs the integration suites against real MySQL and
# Redis services. Migrations are applied exactly once per job, never from
# application startup.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 12.3.4

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate the database client
        run: pnpm db:build
      - name: Migration policy
        run: pnpm db:migrations:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: API end-to-end tests
        run: pnpm test:e2e
      - name: Build
        run: pnpm build
      - name: Bundle budget
        run: pnpm budget
      - name: Contracts are in sync with the API
        run: pnpm contracts:check

  integration:
    name: Integration tests (MySQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: melbourne_sphere_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8.4.6
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # CI-only credentials for throwaway service containers; production secrets
      # never live in this file.
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/melbourne_sphere_test
      TEST_DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/melbourne_sphere_test
      SHADOW_DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/melbourne_sphere_shadow
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:build
      - name: Apply migrations once
        run: pnpm db:migrate:deploy
      - name: Integration tests
        run: pnpm test:integration

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails the job on a high or critical advisory; moderate findings are
      # reported and triaged rather than blocking every build.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
